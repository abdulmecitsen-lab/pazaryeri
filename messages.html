<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar — Pazaryeri</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
  <style>
    /* ── MSG-ROW (eksikti, eklendi) ── */
    .msg-row { display:flex; margin-bottom:4px; }
    .msg-row.sent  { justify-content:flex-end; }
    .msg-row.received { justify-content:flex-start; }

    /* ── GÖRSEL MESAJ ── */
    .msg-image { max-width:200px; border-radius:10px; margin-top:6px; cursor:zoom-in; display:block; }

    /* ── GÖRSEL ZOOM ── */
    #imageModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88);
      z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
    #imageModal.open { display:flex; }
    #imageModal img { max-width:90vw; max-height:90vh; border-radius:12px; }

    /* ── GÖRSEL ÖNIZLEME (gönderim öncesi) ── */
    .img-preview-wrap { padding:6px 16px; display:none; }
    .img-preview-inner { position:relative; display:inline-block; }
    .img-preview-inner img { height:72px; border-radius:8px; border:2px solid var(--border); }
    .img-preview-inner button { position:absolute; top:-7px; right:-7px; background:#ef4444;
      color:#fff; border:none; border-radius:50%; width:20px; height:20px;
      font-size:12px; cursor:pointer; line-height:1; }

    /* ── HEADER AKSIYONLAR ── */
    .chat-header-actions { display:flex; gap:6px; margin-left:auto; }
    .hdr-btn { background:none; border:1px solid var(--border); color:var(--text3);
      font-size:12px; cursor:pointer; padding:5px 10px; border-radius:6px; transition:.2s; }
    .hdr-btn:hover { color:#ef4444; border-color:#ef4444; background:#fef2f2; }

    /* ── ATTACH BUTTON ── */
    .attach-btn { background:none; border:none; padding:8px; cursor:pointer;
      color:var(--text3); flex-shrink:0; transition:.2s; }
    .attach-btn:hover { color:var(--primary); }
    .attach-btn svg { width:20px; height:20px; display:block; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">Pazar<span>yeri</span></div>
        <div class="logo-tagline">İlan & Alım Satım</div>
      </div>
    </a>
    <div style="flex:1"></div>
    <div class="header-right">
      <a href="index.html" class="btn-signin" style="text-decoration:none">← Geri</a>
      <a href="profile.html" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <div id="authArea"></div>
    </div>
  </div>
</header>

<!-- GİRİŞ KAPISI -->
<div id="loginGate" style="display:none;text-align:center;padding:100px 20px">
  <div style="font-size:3rem;margin-bottom:14px">🔒</div>
  <h3 style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:8px">Giriş Yapmanız Gerekiyor</h3>
  <p style="color:var(--text3);margin-bottom:24px">Mesajlarınızı görmek için giriş yapın.</p>
  <button onclick="openModal('loginModal')"
    style="padding:12px 28px;background:var(--primary);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer">
    Giriş Yap
  </button>
</div>

<!-- ANA İÇERİK -->
<div id="mainContent" style="display:none;max-width:1200px;margin:0 auto;padding:24px">
  <div style="font-size:20px;font-weight:900;color:var(--text);margin-bottom:18px">💬 Mesajlarım</div>
  <div class="messages-layout">

    <!-- SOL: KONUŞMA LİSTESİ -->
    <div class="conv-list">
      <div class="conv-list-header">
        Konuşmalar
        <span id="convBadge" style="background:var(--border);color:var(--text3);font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px">0</span>
      </div>
      <div class="conv-search">
        <input type="text" placeholder="Konuşma ara..." oninput="filterConvs(this.value)">
      </div>
      <div class="conv-items" id="convItems">
        <div style="padding:40px;text-align:center;color:var(--text3);font-size:13px">
          <div style="font-size:2rem;opacity:.2;margin-bottom:8px">⏳</div>
          Yükleniyor...
        </div>
      </div>
    </div>

    <!-- SAĞ: CHAT PENCERE -->
    <div class="chat-window" id="chatWindow">
      <div class="chat-empty">
        <div class="ce-icon">💬</div>
        <p>Bir konuşma seçin</p>
      </div>
    </div>

  </div>
</div>

<!-- GÖRSEL ZOOM MODAL -->
<div id="imageModal" onclick="this.classList.remove('open')">
  <img id="imageModalImg" src="" alt="Görsel">
</div>

<!-- ŞİKAYET MODAL -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('reportModal')">✕</button>
    <h2>Kullanıcıyı Şikayet Et ⚠️</h2>
    <p style="color:var(--text3);font-size:14px;margin-bottom:16px">Şikayet sebebini seçin:</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="spam"> Spam / Reklam
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="dolandirici"> Dolandırıcılık
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="hakaret"> Hakaret / Tehdit
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="diger"> Diğer
      </label>
    </div>
    <button onclick="submitReport()"
      style="margin-top:16px;width:100%;padding:12px;background:#ef4444;color:white;border:none;border-radius:var(--radius);font-weight:700;cursor:pointer">
      Şikayet Gönder
    </button>
  </div>
</div>

<!-- GİRİŞ MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <h2>Giriş Yap 👋</h2>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">E-posta</label>
        <input type="email" id="lEmail" class="form-input" placeholder="ornek@mail.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input type="password" id="lPass" class="form-input" required>
      </div>
      <button type="submit" class="btn-submit">Giriş Yap</button>
    </form>
    <div class="form-footer">
      Hesabınız yok mu?
      <a onclick="switchModal('loginModal','signupModal')" style="cursor:pointer;color:var(--primary)">Kayıt Ol</a>
    </div>
  </div>
</div>

<!-- KAYIT MODAL -->
<div class="modal-overlay" id="signupModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('signupModal')">✕</button>
    <h2>Hesap Oluştur 🎉</h2>
    <form onsubmit="doSignup(event)">
      <div class="form-group">
        <label class="form-label">Ad Soyad</label>
        <input type="text" id="sName" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">E-posta</label>
        <input type="email" id="sEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input type="password" id="sPass" class="form-input" minlength="8" required>
      </div>
      <button type="submit" class="btn-submit">Kayıt Ol</button>
    </form>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>


<script>
(function () {
'use strict';

const SURL = 'https://sbubvjeguxuqgiklrajk.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidWJ2amVndXh1cWdpa2xyYWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzOTQxNTIsImV4cCI6MjA4Nzk3MDE1Mn0.dVwPmfxu2B0o9M-lMr5_k_Qy3YPDfiuk-TX2emDk9SQ';

// Supabase client - lock sorunsuz
const sb = window.supabase.createClient(SURL, SKEY, {
  auth: { storageKey: 'pz_auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});

// STATE
let user = null, convs = [], activeKey = null, realtimeCh = null, pendingImg = null;
const params = new URLSearchParams(window.location.search);
const paramSeller = params.get('seller');
const paramListing = params.get('listing');

// İsim önbelleği
const NAMES = {
  'dd930368-97f1-4558-8fe9-5c5737b4b7c4': 'mecit',
  '827a0dfe-3b33-4844-9aa2-8f1206ab28af': 'Nesrine Şen',
  '55c9bdb1-e686-4d26-b122-7271b437afd7': 'Okan'
};

/* ── UTILS ── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ago(d){ if(!d) return ''; var s=Math.floor((Date.now()-new Date(d))/1000); if(s<60) return 'Az önce'; if(s<3600) return ~~(s/60)+' dk'; if(s<86400) return ~~(s/3600)+' sa'; return new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}); }
function ini(n){ return (n||'?').split(' ').filter(Boolean).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
function getName(id){ return NAMES[id] || ('Kullanıcı '+id.slice(0,6)); }

function toast(msg, type){
  type = type||'success';
  var ic = {success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
  var el = document.createElement('div');
  el.className = 'toast'+(type!=='success'?' '+type:'');
  el.innerHTML = '<span>'+ic[type]+'</span><span>'+msg+'</span>';
  $('toastContainer').appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){el.remove();},300); },3500);
}

/* ── MODAL ── */
window.openModal = function(id){ $(id).classList.add('open'); document.body.style.overflow='hidden'; };
window.closeModal = function(id){ $(id).classList.remove('open'); document.body.style.overflow=''; };
window.switchModal = function(a,b){ window.closeModal(a); window.openModal(b); };
document.querySelectorAll('.modal-overlay').forEach(function(o){
  o.addEventListener('click', function(e){ if(e.target===o) window.closeModal(o.id); });
});

/* ── AUTH ── */
window.doLogin = async function(e){
  e.preventDefault();
  var r = await sb.auth.signInWithPassword({ email: $('lEmail').value, password: $('lPass').value });
  if(r.error){ toast(r.error.message,'error'); return; }
  toast('Hoş geldin! 👋');
  window.closeModal('loginModal');
  user = r.data.user;
  startApp();
};
window.doSignup = async function(e){
  e.preventDefault();
  var r = await sb.auth.signUp({ email: $('sEmail').value, password: $('sPass').value, options:{data:{full_name:$('sName').value}} });
  if(r.error){ toast(r.error.message,'error'); return; }
  toast('Kayıt başarılı! E-postanı doğrula 📧');
  window.closeModal('signupModal');
};

function renderAuth(){
  var a = $('authArea'); if(!a) return;
  if(user){
    var nm = (user.user_metadata&&user.user_metadata.full_name)||user.email;
    a.innerHTML = '<a href="profile.html"><div class="user-avatar" style="background:var(--primary)">'+ini(nm)+'</div></a>';
  } else {
    a.innerHTML = '<button class="btn-signin" onclick="openModal(\'loginModal\')">Giriş Yap</button>';
  }
}

/* ── MESAJLARI SUPABASE REST API İLE ÇEK (lock yok) ── */
async function fetchMessages(){
  var token = null;
  // Token'ı localStorage'dan al
  try {
    var raw = localStorage.getItem('pz_auth');
    if(raw) token = JSON.parse(raw).access_token;
  } catch(e){}
  if(!token) {
    try {
      var s = await sb.auth.getSession();
      if(s.data&&s.data.session) token = s.data.session.access_token;
    } catch(e){}
  }
  if(!token) return null;

  var url = SURL+'/rest/v1/mesajlar?or=(gonderen_id.eq.'+user.id+',alici_id.eq.'+user.id+')&order=created_at.asc&select=*';
  var r = await fetch(url, {
    headers: {
      'apikey': SKEY,
      'Authorization': 'Bearer '+token,
      'Content-Type': 'application/json'
    }
  });
  if(!r.ok) return null;
  return await r.json();
}

async function sendMessage(payload){
  var token = null;
  try { var raw=localStorage.getItem('pz_auth'); if(raw) token=JSON.parse(raw).access_token; } catch(e){}
  if(!token){ try{ var s=await sb.auth.getSession(); if(s.data&&s.data.session) token=s.data.session.access_token; }catch(e){} }
  if(!token) return {error:'Token yok'};

  var r = await fetch(SURL+'/rest/v1/mesajlar', {
    method: 'POST',
    headers: {
      'apikey': SKEY,
      'Authorization': 'Bearer '+token,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(payload)
  });
  var data = await r.json();
  if(!r.ok) return {error: data};
  return {data: Array.isArray(data)?data[0]:data};
}

/* ── KONUŞMALARI YÜKLE ── */
async function loadConvs(){
  $('convItems').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3);font-size:13px"><div style="font-size:2rem;opacity:.2;margin-bottom:8px">⏳</div>Yükleniyor...</div>';

  var msgs = await fetchMessages();

  if(!msgs){
    $('convItems').innerHTML = '<div style="padding:20px;color:#ef4444;font-size:13px;text-align:center">⚠️ Mesajlar yüklenemedi.<br><button onclick="loadConvs()" style="margin-top:8px;padding:8px 16px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700">Tekrar Dene</button></div>';
    return;
  }

  // Gruplama - ilan_id'yi key'den çıkar, aynı iki kişi = tek konuşma
  var map = {};
  msgs.forEach(function(m){
    var otherId = m.gonderen_id===user.id ? m.alici_id : m.gonderen_id;
    if(otherId===user.id) return;
    var key = [user.id,otherId].sort().join('_');
    if(!map[key]) map[key]={key:key,otherId:otherId,listingId:m.ilan_id||null,msgs:[],unread:0,otherName:getName(otherId),listingTitle:''};
    map[key].msgs.push(m);
    // En son ilan_id'yi sakla
    if(m.ilan_id) map[key].listingId=m.ilan_id;
    if(m.alici_id===user.id&&!m.okundu) map[key].unread++;
  });

  convs = Object.values(map).sort(function(a,b){
    var la=(a.msgs[a.msgs.length-1]||{}).created_at||'';
    var lb=(b.msgs[b.msgs.length-1]||{}).created_at||'';
    return lb.localeCompare(la);
  });

  // URL parametresi ile konuşma aç
  if(paramSeller && paramSeller!==user.id){
    var tKey=[user.id,paramSeller].sort().join('_');
    var tConv=convs.find(function(c){return c.key===tKey;});
    if(!tConv){
      tConv={key:tKey,otherId:paramSeller,listingId:paramListing||null,msgs:[],unread:0,otherName:getName(paramSeller),listingTitle:''};
      convs.unshift(tConv);
    } else if(paramListing) {
      tConv.listingId=paramListing;
    }
    renderConvList();
    openConv(tConv);
    return;
  }

  renderConvList();
  if(convs.length) openConv(convs[0]);
  else showEmpty();
}

function showEmpty(){
  $('convItems').innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);font-size:13px"><div style="font-size:2.5rem;opacity:.2;margin-bottom:10px">💬</div>Henüz mesajınız yok.<br><br><a href="index.html" style="color:var(--primary);font-weight:700">İlanlara göz atın →</a></div>';
}

/* ── KONUŞMA LİSTESİ ── */
function renderConvList(){
  var el=$('convItems');
  $('convBadge').textContent=convs.length;
  if(!convs.length){showEmpty();return;}
  el.innerHTML=convs.map(function(c){
    var last=c.msgs[c.msgs.length-1];
    var preview=last?(last.resim_url?'📷 Görsel':esc(last.icerik||'').slice(0,50)):'Yeni konuşma';
    var isActive=activeKey===c.key;
    var hasUnread=c.unread>0;
    return '<div class="conv-item'+(hasUnread?' unread':'')+(isActive?' active':'')+'" onclick="openConvByKey(\''+c.key+'\')">'+
      '<div class="conv-avatar">'+ini(c.otherName)+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
          '<div style="font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.otherName)+'</div>'+
          '<div style="font-size:11px;color:var(--text3);flex-shrink:0;margin-left:8px">'+(last?ago(last.created_at):'')+'</div>'+
        '</div>'+
        '<div style="font-size:13px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">'+preview+'</div>'+
      '</div>'+
      (hasUnread?'<div style="background:var(--primary);color:white;border-radius:50%;min-width:18px;height:18px;padding:0 4px;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700">'+c.unread+'</div>':'')+
    '</div>';
  }).join('');
}

window.filterConvs=function(val){
  var v=val.toLowerCase();
  document.querySelectorAll('.conv-item').forEach(function(el,i){
    var c=convs[i]; if(!c) return;
    el.style.display=(c.otherName.toLowerCase().includes(v))?'':'none';
  });
};

window.openConvByKey=function(key){var c=convs.find(function(x){return x.key===key;}); if(c) openConv(c);};
window.mobileBackToList=function(){document.querySelector('.conv-list').style.display=''; $('chatWindow').style.display='none'; activeKey=null; window._activeConv=null;};

/* ── KONUŞMAYI AÇ ── */
function openConv(conv){
  activeKey=conv.key; conv.unread=0; window._activeConv=conv;
  renderConvList(); renderChat(conv);
  if(window.innerWidth<=768){document.querySelector('.conv-list').style.display='none'; $('chatWindow').style.display='flex';}
}

/* ── CHAT RENDER ── */
function renderChat(conv){
  var win=$('chatWindow');
  var backBtn=window.innerWidth<=768?'<button onclick="mobileBackToList()" style="background:none;border:none;font-size:22px;cursor:pointer;padding:0 10px 0 0;color:var(--text);line-height:1">←</button>':'';
  win.innerHTML=
    '<div class="chat-header">'+backBtn+
      '<div class="conv-avatar">'+ini(conv.otherName)+'</div>'+
      '<div class="chat-header-info"><div class="chat-header-name">'+esc(conv.otherName)+'</div>'+
      (conv.listingTitle?'<div class="chat-header-sub">📋 '+esc(conv.listingTitle)+'</div>':'')+
      '</div>'+
      '<div class="chat-header-actions">'+
        '<button class="hdr-btn" onclick="openModal(\'reportModal\')">⚠️ Şikayet</button>'+
        '<button class="hdr-btn" onclick="blockUser(\''+esc(conv.otherId)+'\')">🚫 Engelle</button>'+
      '</div>'+
    '</div>'+
    '<div class="chat-messages" id="chatMsgs"></div>'+
    '<div class="img-preview-wrap" id="imgPreviewWrap"><div class="img-preview-inner"><img id="imgPreviewThumb" src="" alt=""><button onclick="clearPendingImg()">✕</button></div></div>'+
    '<div class="chat-input-area">'+
      '<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(this)">'+
      '<button class="attach-btn" onclick="$(\'fileInput\').click()" title="Görsel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>'+
      '<input type="text" id="chatInput" placeholder="Mesaj yazın..." onkeydown="handleKey(event)">'+
      '<button class="btn-send" id="sendBtn" onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>'+
    '</div>';
  renderMsgs(conv.msgs);
  setTimeout(function(){var inp=$('chatInput'); if(inp) inp.focus();},80);
}

window.handleKey=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}};

function renderMsgs(msgs){
  var el=$('chatMsgs'); if(!el) return;
  if(!msgs||!msgs.length){el.innerHTML='<div style="text-align:center;color:var(--text3);font-size:13px;padding:30px">Henüz mesaj yok. İlk mesajı siz gönderin! 👋</div>';return;}
  el.innerHTML=msgs.map(function(m){
    var sent=m.gonderen_id===user.id;
    var img=m.resim_url?'<div><img src="'+esc(m.resim_url)+'" class="msg-image" onclick="zoomImg(\''+esc(m.resim_url)+'\')" alt="Görsel"></div>':'';
    var txt=m.icerik?'<div>'+esc(m.icerik)+'</div>':'';
    var tick=sent?(m.okundu?' ✓✓':' ✓'):'';
    return '<div class="msg-row '+(sent?'sent':'received')+'"><div class="msg-bubble'+(sent?' sent':'')+'">'+img+txt+'<div class="msg-time">'+ago(m.created_at)+tick+'</div></div></div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}

window.zoomImg=function(src){$('imageModalImg').src=src; $('imageModal').classList.add('open');};

/* ── GÖRSEL ── */
window.handleFileSelect=function(el){
  var f=el.files[0]; if(!f) return;
  pendingImg=f;
  var r=new FileReader();
  r.onload=function(ev){$('imgPreviewThumb').src=ev.target.result; $('imgPreviewWrap').style.display='block';};
  r.readAsDataURL(f); el.value='';
};
window.clearPendingImg=function(){pendingImg=null; $('imgPreviewWrap').style.display='none'; $('imgPreviewThumb').src='';};

/* ── MESAJ GÖNDER ── */
window.sendMsg=async function(){
  var conv=window._activeConv;
  if(!conv){toast('Önce bir konuşma seçin','warning');return;}
  if(!conv.otherId||conv.otherId===user.id){toast('Geçersiz alıcı','warning');return;}
  var inp=$('chatInput');
  var text=inp?inp.value.trim():'';
  var hasImg=!!pendingImg;
  if(!text&&!hasImg) return;
  var btn=$('sendBtn');
  if(btn){btn.disabled=true;btn.style.opacity='0.5';}
  if(inp) inp.value='';

  // Optimistik baloncuk
  var chatEl=$('chatMsgs');
  if(chatEl){var b=document.createElement('div');b.className='msg-row sent';b.innerHTML='<div class="msg-bubble sent">'+(text?'<div>'+esc(text)+'</div>':'')+(hasImg?'<div style="opacity:.5;font-size:12px">📷 Yükleniyor...</div>':'')+'<div class="msg-time">Az önce ✓</div></div>';chatEl.appendChild(b);chatEl.scrollTop=chatEl.scrollHeight;}

  var imgUrl=null;
  if(hasImg){
    try{
      var ext=(pendingImg.name.split('.').pop()||'jpg').toLowerCase();
      var fname='msg_'+user.id+'_'+Date.now()+'.'+ext;
      var up=await sb.storage.from('urun-resimleri').upload(fname,pendingImg,{upsert:true});
      if(!up.error){var pub=sb.storage.from('urun-resimleri').getPublicUrl(fname);imgUrl=pub.data.publicUrl;}
    }catch(e){}
    window.clearPendingImg();
  }

  var payload={gonderen_id:user.id,alici_id:conv.otherId,ilan_id:conv.listingId||null,icerik:text||null,okundu:false};
  if(imgUrl) payload.resim_url=imgUrl;

  var ins=await sendMessage(payload);
  if(btn){btn.disabled=false;btn.style.opacity='1';}
  if(ins.error){toast('Gönderilemedi','error');return;}
  var c=convs.find(function(x){return x.key===conv.key;});
  if(c&&ins.data) c.msgs.push(ins.data);
  if(c) renderMsgs(c.msgs);
  renderConvList();
};

/* ── ENGELLE/ŞİKAYET ── */
window.submitReport=function(){var r=document.querySelector('input[name="reportReason"]:checked');if(!r){toast('Neden seçin','warning');return;}toast('Şikayet alındı ✅','info');window.closeModal('reportModal');};
window.blockUser=function(id){if(!confirm('Engellemek istiyor musunuz?')) return;convs=convs.filter(function(c){return c.otherId!==id;});renderConvList();$('chatWindow').innerHTML='<div class="chat-empty"><div class="ce-icon">💬</div><p>Bir konuşma seçin</p></div>';activeKey=null;window._activeConv=null;};

/* ── REALTIME ── */
function subscribeRealtime(){
  realtimeCh=sb.channel('msgs_'+user.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mesajlar',filter:'alici_id=eq.'+user.id},function(payload){
      var m=payload.new;
      if(m.gonderen_id===user.id) return;
      var key=[user.id,m.gonderen_id].sort().join('_');
      var conv=convs.find(function(c){return c.key===key;});
      if(!conv){conv={key:key,otherId:m.gonderen_id,listingId:m.ilan_id||null,msgs:[],unread:0,otherName:getName(m.gonderen_id),listingTitle:''};convs.unshift(conv);}
      conv.msgs.push(m);
      if(activeKey===key){renderMsgs(conv.msgs);sb.from('mesajlar').update({okundu:true}).eq('id',m.id).then(function(){});}
      else{conv.unread++;toast(conv.otherName+': '+(m.icerik||'📷 Görsel').slice(0,40),'info');}
      renderConvList();
    }).subscribe();
}

/* ── BAŞLATICI ── */
async function startApp(){
  renderAuth();
  $('loginGate').style.display='none';
  $('mainContent').style.display='block';
  await loadConvs();
  subscribeRealtime();
}

// Sayfa açılınca session kontrol et
(async function(){
  // 1. localStorage'dan token oku
  try{
    var raw=localStorage.getItem('pz_auth');
    if(raw){
      var parsed=JSON.parse(raw);
      // Supabase token yapısı: {access_token, refresh_token, expires_at, user: {...}}
      var userData = parsed && (parsed.user || (parsed.currentSession && parsed.currentSession.user));
      var accessToken = parsed && (parsed.access_token || (parsed.currentSession && parsed.currentSession.access_token));
      var expiresAt = parsed && (parsed.expires_at || (parsed.currentSession && parsed.currentSession.expires_at) || 9999999999);
      if(accessToken && userData && expiresAt*1000>Date.now()){
        user={id:userData.id,email:userData.email,user_metadata:userData.user_metadata||{}};
        await startApp();
        return;
      }
    }
  }catch(e){}

  // 2. setSession dene
  try{
    var raw2=localStorage.getItem('pz_auth');
    if(raw2){
      var p2=JSON.parse(raw2);
      var at=p2&&(p2.access_token||(p2.currentSession&&p2.currentSession.access_token));
      var rt=p2&&(p2.refresh_token||(p2.currentSession&&p2.currentSession.refresh_token));
      if(at){
        var r=await sb.auth.setSession({access_token:at,refresh_token:rt});
        if(r.data&&r.data.session){user=r.data.session.user;await startApp();return;}
      }
    }
  }catch(e){}

  // 3. getSession dene
  try{
    var r2=await sb.auth.getSession();
    if(r2.data&&r2.data.session){user=r2.data.session.user;await startApp();return;}
  }catch(e){}

  // 4. Giriş ekranı göster
  $('mainContent').style.display='none';
  $('loginGate').style.display='block';
  setTimeout(function(){window.openModal('loginModal');},300);
})();

})();
</script>
