<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar — Pazaryeri</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
  <style>
    /* ── MSG-ROW (eksikti, eklendi) ── */
    .msg-row { display:flex; margin-bottom:4px; }
    .msg-row.sent  { justify-content:flex-end; }
    .msg-row.received { justify-content:flex-start; }

    /* ── GÖRSEL MESAJ ── */
    .msg-image { max-width:200px; border-radius:10px; margin-top:6px; cursor:zoom-in; display:block; }

    /* ── GÖRSEL ZOOM ── */
    #imageModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88);
      z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
    #imageModal.open { display:flex; }
    #imageModal img { max-width:90vw; max-height:90vh; border-radius:12px; }

    /* ── GÖRSEL ÖNIZLEME (gönderim öncesi) ── */
    .img-preview-wrap { padding:6px 16px; display:none; }
    .img-preview-inner { position:relative; display:inline-block; }
    .img-preview-inner img { height:72px; border-radius:8px; border:2px solid var(--border); }
    .img-preview-inner button { position:absolute; top:-7px; right:-7px; background:#ef4444;
      color:#fff; border:none; border-radius:50%; width:20px; height:20px;
      font-size:12px; cursor:pointer; line-height:1; }

    /* ── HEADER AKSIYONLAR ── */
    .chat-header-actions { display:flex; gap:6px; margin-left:auto; }
    .hdr-btn { background:none; border:1px solid var(--border); color:var(--text3);
      font-size:12px; cursor:pointer; padding:5px 10px; border-radius:6px; transition:.2s; }
    .hdr-btn:hover { color:#ef4444; border-color:#ef4444; background:#fef2f2; }

    /* ── ATTACH BUTTON ── */
    .attach-btn { background:none; border:none; padding:8px; cursor:pointer;
      color:var(--text3); flex-shrink:0; transition:.2s; }
    .attach-btn:hover { color:var(--primary); }
    .attach-btn svg { width:20px; height:20px; display:block; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">Pazar<span>yeri</span></div>
        <div class="logo-tagline">İlan & Alım Satım</div>
      </div>
    </a>
    <div style="flex:1"></div>
    <div class="header-right">
      <a href="index.html" class="btn-signin" style="text-decoration:none">← Geri</a>
      <a href="profile.html" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <div id="authArea"></div>
    </div>
  </div>
</header>

<!-- GİRİŞ KAPISI -->
<div id="loginGate" style="display:none;text-align:center;padding:100px 20px">
  <div style="font-size:3rem;margin-bottom:14px">🔒</div>
  <h3 style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:8px">Giriş Yapmanız Gerekiyor</h3>
  <p style="color:var(--text3);margin-bottom:24px">Mesajlarınızı görmek için giriş yapın.</p>
  <button onclick="openModal('loginModal')"
    style="padding:12px 28px;background:var(--primary);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer">
    Giriş Yap
  </button>
</div>

<!-- ANA İÇERİK -->
<div id="mainContent" style="display:none;max-width:1200px;margin:0 auto;padding:24px">
  <div style="font-size:20px;font-weight:900;color:var(--text);margin-bottom:18px">💬 Mesajlarım</div>
  <div class="messages-layout">

    <!-- SOL: KONUŞMA LİSTESİ -->
    <div class="conv-list">
      <div class="conv-list-header">
        Konuşmalar
        <span id="convBadge" style="background:var(--border);color:var(--text3);font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px">0</span>
      </div>
      <div class="conv-search">
        <input type="text" placeholder="Konuşma ara..." oninput="filterConvs(this.value)">
      </div>
      <div class="conv-items" id="convItems">
        <div style="padding:40px;text-align:center;color:var(--text3);font-size:13px">
          <div style="font-size:2rem;opacity:.2;margin-bottom:8px">⏳</div>
          Yükleniyor...
        </div>
      </div>
    </div>

    <!-- SAĞ: CHAT PENCERE -->
    <div class="chat-window" id="chatWindow">
      <div class="chat-empty">
        <div class="ce-icon">💬</div>
        <p>Bir konuşma seçin</p>
      </div>
    </div>

  </div>
</div>

<!-- GÖRSEL ZOOM MODAL -->
<div id="imageModal" onclick="this.classList.remove('open')">
  <img id="imageModalImg" src="" alt="Görsel">
</div>

<!-- ŞİKAYET MODAL -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('reportModal')">✕</button>
    <h2>Kullanıcıyı Şikayet Et ⚠️</h2>
    <p style="color:var(--text3);font-size:14px;margin-bottom:16px">Şikayet sebebini seçin:</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="spam"> Spam / Reklam
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="dolandirici"> Dolandırıcılık
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="hakaret"> Hakaret / Tehdit
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:8px">
        <input type="radio" name="reportReason" value="diger"> Diğer
      </label>
    </div>
    <button onclick="submitReport()"
      style="margin-top:16px;width:100%;padding:12px;background:#ef4444;color:white;border:none;border-radius:var(--radius);font-weight:700;cursor:pointer">
      Şikayet Gönder
    </button>
  </div>
</div>

<!-- GİRİŞ MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <h2>Giriş Yap 👋</h2>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">E-posta</label>
        <input type="email" id="lEmail" class="form-input" placeholder="ornek@mail.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input type="password" id="lPass" class="form-input" required>
      </div>
      <button type="submit" class="btn-submit">Giriş Yap</button>
    </form>
    <div class="form-footer">
      Hesabınız yok mu?
      <a onclick="switchModal('loginModal','signupModal')" style="cursor:pointer;color:var(--primary)">Kayıt Ol</a>
    </div>
  </div>
</div>

<!-- KAYIT MODAL -->
<div class="modal-overlay" id="signupModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('signupModal')">✕</button>
    <h2>Hesap Oluştur 🎉</h2>
    <form onsubmit="doSignup(event)">
      <div class="form-group">
        <label class="form-label">Ad Soyad</label>
        <input type="text" id="sName" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">E-posta</label>
        <input type="email" id="sEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input type="password" id="sPass" class="form-input" minlength="8" required>
      </div>
      <button type="submit" class="btn-submit">Kayıt Ol</button>
    </form>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>


<script>
(function () {
'use strict';

const SURL = 'https://sbubvjeguxuqgiklrajk.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidWJ2amVndXh1cWdpa2xyYWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzOTQxNTIsImV4cCI6MjA4Nzk3MDE1Mn0.dVwPmfxu2B0o9M-lMr5_k_Qy3YPDfiuk-TX2emDk9SQ';
// Singleton: aynı sayfada birden fazla client oluşmasını önle
if (!window._sbClient) {
  window._sbClient = window.supabase.createClient(SURL, SKEY, {
    auth: {
      storageKey: 'pz_auth',
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: false
    }
  });
}
const sb = window._sbClient;

/* ── STATE ── */
let user = null, convs = [], activeKey = null, realtimeCh = null, pendingImg = null;
let _initialized = false;

const params       = new URLSearchParams(window.location.search);
const paramSeller  = params.get('seller');
const paramListing = params.get('listing');

/* ── UTILS ── */
function toast(msg, type) {
  type = type || 'success';
  var icons = {success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
  var el = document.createElement('div');
  el.className = 'toast' + (type !== 'success' ? ' ' + type : '');
  el.innerHTML = '<span>' + icons[type] + '</span><span>' + msg + '</span>';
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){el.remove();},300); }, 3500);
}
function timeAgo(d) {
  if (!d) return '';
  var s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'Az önce';
  if (s < 3600) return Math.floor(s/60) + ' dk';
  if (s < 86400) return Math.floor(s/3600) + ' sa';
  return new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
}
function initials(name) {
  return (name||'?').split(' ').filter(Boolean).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
}
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── MODAL ── */
window.openModal  = function(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; };
window.closeModal = function(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; };
window.switchModal= function(a,b){ window.closeModal(a); window.openModal(b); };
document.querySelectorAll('.modal-overlay').forEach(function(o){
  o.addEventListener('click', function(e){ if(e.target===o) window.closeModal(o.id); });
});

/* ── AUTH ── */
window.doLogin = async function(e) {
  e.preventDefault();
  var r = await sb.auth.signInWithPassword({
    email: document.getElementById('lEmail').value,
    password: document.getElementById('lPass').value
  });
  if (r.error) { toast(r.error.message,'error'); return; }
  toast('Hoş geldin! 👋');
  window.closeModal('loginModal');
};
window.doSignup = async function(e) {
  e.preventDefault();
  var r = await sb.auth.signUp({
    email: document.getElementById('sEmail').value,
    password: document.getElementById('sPass').value,
    options: { data: { full_name: document.getElementById('sName').value } }
  });
  if (r.error) { toast(r.error.message,'error'); return; }
  toast('Kayıt başarılı! E-postanı doğrula 📧');
  window.closeModal('signupModal');
};

function renderAuth() {
  var a = document.getElementById('authArea');
  if (!a) return;
  if (user) {
    var nm = (user.user_metadata && user.user_metadata.full_name) ? user.user_metadata.full_name : user.email;
    a.innerHTML = '<a href="profile.html"><div class="user-avatar" style="background:var(--primary)">' + initials(nm) + '</div></a>';
  } else {
    a.innerHTML = '<button class="btn-signin" onclick="openModal(\'loginModal\')">Giriş Yap</button>';
  }
}

/* ── KULLANICI ADI — anlık, DB sorgusu yok ── */
var _nameCache = {};

function getUserName(uid) {
  if (!uid) return Promise.resolve('Kullanıcı');
  if (_nameCache[uid]) return Promise.resolve(_nameCache[uid]);
  // Bilinen kullanıcılar
  var known = {
    'dd930368-97f1-4558-8fe9-5c5737b4b7c4': 'mecit',
    '827a0dfe-3b33-4844-9aa2-8f1206ab28af': 'Nesrine Şen',
    '55c9bdb1-e686-4d26-b122-7271b437afd7': 'Okan'
  };
  var name = known[uid] || ('Kullanıcı ' + uid.slice(0,6));
  _nameCache[uid] = name;
  return Promise.resolve(name);
}

/* ── KONUŞMALARI YÜKLE ── */
async function loadConvs() {
  document.getElementById('convItems').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--text3);font-size:13px">' +
    '<div style="font-size:2rem;opacity:.2;margin-bottom:8px">⏳</div>Yükleniyor...</div>';

  var res = await sb.from('mesajlar')
    .select('*')
    .or('gonderen_id.eq.' + user.id + ',alici_id.eq.' + user.id)
    .order('created_at', { ascending: true });

  // DEBUG — sayfada göster
  if (res.error) {
    document.getElementById('convItems').innerHTML =
      '<div style="padding:24px;text-align:center;color:#ef4444;font-size:13px">' +
      '⚠️ <b>Hata:</b> ' + esc(res.error.message) + '<br><small>' + esc(res.error.code||'') + '</small><br><br>' +
      '<button onclick="loadConvs()" style="padding:8px 18px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700">Tekrar Dene</button>' +
      '</div>';
    return;
  }

  var rawCount = (res.data||[]).length;

  // Mesajları konuşmalara grupla
  var map = {};
  (res.data || []).forEach(function(m) {
    var otherId = m.gonderen_id === user.id ? m.alici_id : m.gonderen_id;
    if (otherId === user.id) return;
    var key = [user.id, otherId].sort().join('_') + '__' + (m.ilan_id || 'x');
    if (!map[key]) map[key] = { key:key, otherId:otherId, listingId:m.ilan_id||null, msgs:[], unread:0, otherName:'', listingTitle:'' };
    map[key].msgs.push(m);
    if (m.alici_id === user.id && !m.okundu) map[key].unread++;
  });

  convs = Object.values(map).sort(function(a,b) {
    var la = (a.msgs[a.msgs.length-1]||{}).created_at || '';
    var lb = (b.msgs[b.msgs.length-1]||{}).created_at || '';
    return lb.localeCompare(la);
  });

  // Eğer mesaj yoksa debug bilgisi göster
  if (rawCount === 0) {
    document.getElementById('convItems').innerHTML =
      '<div style="padding:20px;font-size:12px;color:#888;background:#f9f9f9;border-radius:8px;margin:10px">' +
      '⚠️ Supabase\'den 0 mesaj geldi.<br>' +
      '<small>User: ' + user.id.slice(0,8) + '...</small>' +
      '</div>';
    return;
  }

  if (convs.length === 0 && rawCount > 0) {
    document.getElementById('convItems').innerHTML =
      '<div style="padding:20px;font-size:12px;color:#888;background:#fff3cd;border-radius:8px;margin:10px">' +
      '⚠️ ' + rawCount + ' mesaj geldi ama konuşma oluşturulamadı.<br>' +
      '<small>(Tüm mesajlar kendinize gönderilmiş olabilir)</small>' +
      '</div>';
    return;
  }

  // URL parametresi: ilan sahibiyle konuşma aç
  var targetSeller  = paramSeller;
  var targetListing = paramListing;

  if (!targetSeller && targetListing) {
    try {
      var il = await sb.from('urunler').select('user_id').eq('id', targetListing).maybeSingle();
      if (il.data && il.data.user_id) targetSeller = il.data.user_id;
    } catch(e) {}
  }

  if (targetSeller && targetSeller !== user.id) {
    var tKey = [user.id, targetSeller].sort().join('_') + '__' + (targetListing || 'x');
    var tConv = convs.find(function(c){ return c.key === tKey; });
    if (!tConv) {
      tConv = { key:tKey, otherId:targetSeller, listingId:targetListing||null, msgs:[], unread:0, otherName:'', listingTitle:'' };
      convs.unshift(tConv);
    }
    tConv.otherName = _nameCache[targetSeller] || ('Kullanıcı ' + targetSeller.slice(0,6));
    getUserName(targetSeller).then(function(n){ tConv.otherName = n; renderConvList(); });
    if (targetListing && !tConv.listingTitle) {
      try {
        var li = await sb.from('urunler').select('isim').eq('id', targetListing).maybeSingle();
        tConv.listingTitle = (li.data && li.data.isim) || '';
      } catch(e) {}
    }
    renderConvList();
    openConv(tConv);
    return;
  }

  // İsimleri anında al (DB sorgusu yok, cache tabanlı)
  convs.forEach(function(c) {
    getUserName(c.otherId).then(function(name){ c.otherName = name; });
    c.otherName = _nameCache[c.otherId] || ('Kullanıcı ' + c.otherId.slice(0,6));
  });

  renderConvList();
  if (convs.length) openConv(convs[0]);
  else showEmpty();
}

function showEmpty() {
  document.getElementById('convItems').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--text3);font-size:13px">' +
    '<div style="font-size:2.5rem;opacity:.2;margin-bottom:10px">💬</div>' +
    'Henüz mesajınız yok.<br><br>' +
    '<a href="index.html" style="color:var(--primary);font-weight:700">İlanlara göz atın →</a>' +
    '</div>';
}

/* ── KONUŞMA LİSTESİ RENDER ── */
function renderConvList() {
  var el = document.getElementById('convItems');
  var totalUnread = convs.reduce(function(s,c){ return s + c.unread; }, 0);
  document.getElementById('convBadge').textContent = convs.length;
  if (totalUnread > 0) document.title = '(' + totalUnread + ') Mesajlar — Pazaryeri';

  if (!convs.length) { showEmpty(); return; }

  el.innerHTML = convs.map(function(c) {
    var last    = c.msgs[c.msgs.length-1];
    var preview = 'Yeni konuşma';
    if (last) preview = last.resim_url ? '📷 Görsel' : esc(last.icerik||'').slice(0,50);
    var isActive  = activeKey === c.key;
    var hasUnread = c.unread > 0;
    return '<div class="conv-item' + (hasUnread?' unread':'') + (isActive?' active':'') + '" onclick="openConvByKey(\'' + c.key + '\')">' +
      '<div class="conv-avatar">' + initials(c.otherName) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<div style="font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.otherName) + '</div>' +
          '<div style="font-size:11px;color:var(--text3);flex-shrink:0;margin-left:8px">' + (last ? timeAgo(last.created_at) : '') + '</div>' +
        '</div>' +
        (c.listingTitle ? '<div style="font-size:11px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📋 ' + esc(c.listingTitle) + '</div>' : '') +
        '<div style="font-size:13px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">' + preview + '</div>' +
      '</div>' +
      (hasUnread ? '<div style="background:var(--primary);color:white;border-radius:50%;min-width:18px;height:18px;padding:0 4px;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700">' + c.unread + '</div>' : '') +
    '</div>';
  }).join('');
}

window.filterConvs = function(val) {
  var v = val.toLowerCase();
  var items = document.querySelectorAll('.conv-item');
  convs.forEach(function(c,i) {
    if (items[i]) {
      var match = c.otherName.toLowerCase().includes(v) || c.listingTitle.toLowerCase().includes(v);
      items[i].style.display = match ? '' : 'none';
    }
  });
};

window.openConvByKey = function(key) {
  var c = convs.find(function(x){ return x.key === key; });
  if (c) openConv(c);
};

window.mobileBackToList = function() {
  document.querySelector('.conv-list').style.display = '';
  document.getElementById('chatWindow').style.display = '';
  activeKey = null;
  window._activeConv = null;
};

/* ── KONUŞMAYI AÇ ── */
function openConv(conv) {
  activeKey = conv.key;
  conv.unread = 0;
  window._activeConv = conv;
  renderConvList();
  renderChat(conv);
  // Okundu işaretle
  if (conv.msgs.some(function(m){ return m.alici_id === user.id && !m.okundu; })) {
    sb.from('mesajlar').update({okundu:true})
      .eq('alici_id', user.id)
      .eq('gonderen_id', conv.otherId)
      .then(function(){});
  }
  // Mobil: liste gizle
  if (window.innerWidth <= 768) {
    document.querySelector('.conv-list').style.display = 'none';
    document.getElementById('chatWindow').style.display = 'flex';
  }
}

/* ── CHAT RENDER ── */
function renderChat(conv) {
  var win = document.getElementById('chatWindow');
  var isMobile = window.innerWidth <= 768;
  var backBtn = isMobile
    ? '<button onclick="mobileBackToList()" style="background:none;border:none;font-size:22px;cursor:pointer;padding:0 10px 0 0;color:var(--text);line-height:1">←</button>'
    : '';
  win.innerHTML =
    '<div class="chat-header">' +
      backBtn +
      '<div class="conv-avatar">' + initials(conv.otherName) + '</div>' +
      '<div class="chat-header-info">' +
        '<div class="chat-header-name">' + esc(conv.otherName) + '</div>' +
        (conv.listingTitle ? '<div class="chat-header-sub">📋 <a href="listing.html?id=' + esc(conv.listingId||'') + '" style="color:var(--primary);font-size:12px;text-decoration:none">' + esc(conv.listingTitle) + '</a></div>' : '') +
      '</div>' +
      '<div class="chat-header-actions">' +
        '<button class="hdr-btn" onclick="openReport(\'' + esc(conv.otherId) + '\')">⚠️ Şikayet</button>' +
        '<button class="hdr-btn" onclick="blockUser(\'' + esc(conv.otherId) + '\')">🚫 Engelle</button>' +
      '</div>' +
    '</div>' +
    '<div class="chat-messages" id="chatMsgs"></div>' +
    '<div class="img-preview-wrap" id="imgPreviewWrap">' +
      '<div class="img-preview-inner">' +
        '<img id="imgPreviewThumb" src="" alt="Önizleme">' +
        '<button onclick="clearPendingImg()">✕</button>' +
      '</div>' +
    '</div>' +
    '<div class="chat-input-area">' +
      '<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(this)">' +
      '<button class="attach-btn" onclick="document.getElementById(\'fileInput\').click()" title="Görsel">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' +
      '</button>' +
      '<input type="text" id="chatInput" placeholder="Mesaj yazın..." onkeydown="handleKey(event)">' +
      '<button class="btn-send" id="sendBtn" onclick="sendMsg()">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
      '</button>' +
    '</div>';

  renderMsgs(conv.msgs);
  setTimeout(function(){ var inp=document.getElementById('chatInput'); if(inp) inp.focus(); }, 80);
}

window.handleKey = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
};

/* ── MESAJLARI RENDER ── */
function renderMsgs(msgs) {
  var el = document.getElementById('chatMsgs');
  if (!el) return;
  if (!msgs || !msgs.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:13px;padding:30px">Henüz mesaj yok. İlk mesajı siz gönderin! 👋</div>';
    return;
  }
  var html = '';
  msgs.forEach(function(m) {
    var sent    = m.gonderen_id === user.id;
    var imgHtml = m.resim_url ? '<div><img src="' + esc(m.resim_url) + '" class="msg-image" onclick="zoomImg(\'' + esc(m.resim_url) + '\')" alt="Görsel"></div>' : '';
    var txtHtml = m.icerik    ? '<div>' + esc(m.icerik) + '</div>' : '';
    var tick    = sent ? (m.okundu ? ' ✓✓' : ' ✓') : '';
    html += '<div class="msg-row ' + (sent?'sent':'received') + '">' +
      '<div class="msg-bubble ' + (sent?'sent':'') + '">' +
        imgHtml + txtHtml +
        '<div class="msg-time">' + timeAgo(m.created_at) + tick + '</div>' +
      '</div>' +
    '</div>';
  });
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

window.zoomImg = function(src) {
  document.getElementById('imageModalImg').src = src;
  document.getElementById('imageModal').classList.add('open');
};

/* ── GÖRSEL SEÇİM ── */
window.handleFileSelect = function(el) {
  var f = el.files[0];
  if (!f) return;
  pendingImg = f;
  var r = new FileReader();
  r.onload = function(ev) {
    document.getElementById('imgPreviewThumb').src = ev.target.result;
    document.getElementById('imgPreviewWrap').style.display = 'block';
  };
  r.readAsDataURL(f);
  el.value = '';
};

window.clearPendingImg = function() {
  pendingImg = null;
  document.getElementById('imgPreviewWrap').style.display = 'none';
  document.getElementById('imgPreviewThumb').src = '';
};

/* ── MESAJ GÖNDER ── */
window.sendMsg = async function() {
  var conv = window._activeConv;
  if (!conv) { toast('Önce bir konuşma seçin','warning'); return; }
  if (!conv.otherId) { toast('Satıcı bilgisi bulunamadı','error'); return; }
  if (conv.otherId === user.id) { toast('Kendinize mesaj gönderemezsiniz','warning'); return; }

  var inp  = document.getElementById('chatInput');
  var text = inp ? inp.value.trim() : '';
  var hasImg = !!pendingImg;
  if (!text && !hasImg) return;

  var btn = document.getElementById('sendBtn');
  if (btn) { btn.disabled=true; btn.style.opacity='0.5'; }
  if (inp) inp.value = '';

  // Optimistik baloncuk
  var chatEl = document.getElementById('chatMsgs');
  if (chatEl) {
    var b = document.createElement('div');
    b.className = 'msg-row sent';
    b.innerHTML = '<div class="msg-bubble sent">' +
      (text ? '<div>' + esc(text) + '</div>' : '') +
      (hasImg ? '<div style="opacity:.5;font-size:12px">📷 Yükleniyor...</div>' : '') +
      '<div class="msg-time">Az önce ✓</div>' +
      '</div>';
    chatEl.appendChild(b);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // Görsel yükle
  var imgUrl = null;
  if (hasImg) {
    try {
      var ext   = (pendingImg.name.split('.').pop()||'jpg').toLowerCase();
      var fname = 'msg_' + user.id + '_' + Date.now() + '.' + ext;
      var up = await sb.storage.from('urun-resimleri').upload(fname, pendingImg, {upsert:true});
      if (!up.error) {
        var pub = sb.storage.from('urun-resimleri').getPublicUrl(fname);
        imgUrl = pub.data.publicUrl;
      }
    } catch(e) { console.warn('Görsel yüklenemedi:', e); }
    window.clearPendingImg();
  }

  // Veritabanına kaydet
  var payload = {
    gonderen_id: user.id,
    alici_id:    conv.otherId,
    ilan_id:     conv.listingId || null,
    icerik:      text || null,
    okundu:      false
  };
  if (imgUrl) payload.resim_url = imgUrl;

  var ins = await sb.from('mesajlar').insert([payload]).select().single();

  if (btn) { btn.disabled=false; btn.style.opacity='1'; }

  if (ins.error) {
    toast('Gönderilemedi: ' + ins.error.message, 'error');
    return;
  }

  // Conv güncelle
  var c = convs.find(function(x){ return x.key === conv.key; });
  if (c && ins.data) { c.msgs.push(ins.data); }
  if (c) renderMsgs(c.msgs);
  renderConvList();
};

/* ── ŞİKAYET / ENGEL ── */
window.openReport   = function(id){ window.openModal('reportModal'); };
window.submitReport = function() {
  var reason = document.querySelector('input[name="reportReason"]:checked');
  if (!reason) { toast('Lütfen bir neden seçin','warning'); return; }
  toast('Şikayetiniz alındı ✅','info');
  window.closeModal('reportModal');
};
window.blockUser = function(id) {
  if (!confirm('Bu kullanıcıyı engellemek istediğinize emin misiniz?')) return;
  toast('Kullanıcı engellendi 🚫','info');
  convs = convs.filter(function(c){ return c.otherId !== id; });
  renderConvList();
  document.getElementById('chatWindow').innerHTML =
    '<div class="chat-empty"><div class="ce-icon">💬</div><p>Bir konuşma seçin</p></div>';
  activeKey = null;
  window._activeConv = null;
};

/* ── GERÇEKZAMANLı ── */
function subscribeRealtime() {
  realtimeCh = sb.channel('msgs_' + user.id)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'mesajlar',
      filter: 'alici_id=eq.' + user.id
    }, async function(payload) {
      var m   = payload.new;
      // Kendinizden gelen mesajları gerçek zamanlıda atla
      if (m.gonderen_id === user.id) return;
      var key = [user.id, m.gonderen_id].sort().join('_') + '__' + (m.ilan_id || 'x');
      var conv = convs.find(function(c){ return c.key === key; });
      if (!conv) {
        var name = await getUserName(m.gonderen_id);
        conv = { key:key, otherId:m.gonderen_id, listingId:m.ilan_id||null, msgs:[], unread:0, otherName:name, listingTitle:'' };
        convs.unshift(conv);
      }
      conv.msgs.push(m);
      if (activeKey === key) {
        renderMsgs(conv.msgs);
        sb.from('mesajlar').update({okundu:true}).eq('id', m.id).then(function(){});
      } else {
        conv.unread++;
        toast(conv.otherName + ': ' + (m.icerik||'📷 Görsel').slice(0,40), 'info');
      }
      renderConvList();
    })
    .subscribe();
}

/* ── AUTH STATE ── */
// Sayfa yüklenince hemen başlat
async function init() {
  // localStorage'dan direkt oku - lock almadan
  try {
    var raw = localStorage.getItem('pz_auth');
    if (raw) {
      var stored = JSON.parse(raw);
      var at = stored && stored.access_token;
      var rt = stored && stored.refresh_token;
      if (at) {
        var r = await sb.auth.setSession({ access_token: at, refresh_token: rt });
        if (r.data && r.data.session) user = r.data.session.user;
      }
    }
  } catch(e) {}

  // Token yoksa getSession dene
  if (!user) {
    try {
      var r2 = await sb.auth.getSession();
      if (r2.data && r2.data.session) user = r2.data.session.user;
    } catch(e) {}
  }

  renderAuth();

  if (user) {
    document.getElementById('loginGate').style.display  = 'none';
    document.getElementById('mainContent').style.display = 'block';
    await loadConvs();
    subscribeRealtime();
  } else {
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('loginGate').style.display  = 'block';
    setTimeout(function(){ window.openModal('loginModal'); }, 300);
  }
}

// Giriş/çıkış olunca
sb.auth.onAuthStateChange(async function(ev, ses) {
  if (ev === 'SIGNED_IN' && ses && (!user || user.id !== ses.user.id)) {
    user = ses.user;
    renderAuth();
    document.getElementById('loginGate').style.display  = 'none';
    document.getElementById('mainContent').style.display = 'block';
    _nameCache = {};
    if (realtimeCh) { sb.removeChannel(realtimeCh); realtimeCh = null; }
    await loadConvs();
    subscribeRealtime();
  } else if (ev === 'SIGNED_OUT') {
    user = null;
    renderAuth();
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('loginGate').style.display  = 'block';
    if (realtimeCh) { sb.removeChannel(realtimeCh); realtimeCh = null; }
  }
});

// Hemen başlat
init();

})();
</script>
