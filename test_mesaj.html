<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesaj Test v2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{font-family:monospace;padding:20px;background:#0f0f0f;color:#eee;max-width:800px;margin:0 auto}
    h2{color:#fff}
    .section{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:16px}
    .section h3{margin:0 0 12px;color:#ffaa00;font-size:14px}
    button{background:#222;color:#00ff00;border:1px solid #00ff00;padding:9px 16px;cursor:pointer;margin:4px;border-radius:4px;font-family:monospace;font-size:13px}
    button:hover{background:#003300}
    button.red{color:#ff4444;border-color:#ff4444}
    button.red:hover{background:#330000}
    input{background:#111;border:1px solid #444;color:white;padding:8px 10px;border-radius:4px;width:100%;margin:4px 0;font-size:13px}
    label{color:#888;font-size:11px;display:block;margin-top:8px}
    #log{background:#111;border:1px solid #222;padding:14px;border-radius:8px;white-space:pre-wrap;font-size:12px;line-height:1.6;min-height:160px;max-height:400px;overflow-y:auto}
    .ok{color:#00dd00}.err{color:#ff4444}.warn{color:#ffaa00}.inf{color:#88aaff}
    .uid{background:#222;padding:6px 10px;border-radius:4px;font-size:12px;color:#aaa;margin-top:8px;word-break:break-all}
  </style>
</head>
<body>
<h2>🔧 Pazaryeri Mesaj Test v2</h2>

<div class="section">
  <h3>1. GİRİŞ</h3>
  <label>E-posta</label><input id="email" type="email" placeholder="mail@ornek.com">
  <label>Şifre</label><input id="pass" type="password">
  <button onclick="doLogin()">Giriş Yap</button>
  <div class="uid" id="userInfo">Giriş yapılmadı</div>
</div>

<div class="section">
  <h3>2. MESAJ GÖNDER (başka kullanıcıya)</h3>
  <label>Alıcı User ID — Supabase Dashboard → Authentication → Users'dan kopyalayın</label>
  <input id="aliciId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
  <label>Mesaj metni</label>
  <input id="msgText" value="Merhaba, test mesajı!">
  <button onclick="sendTest()">Mesaj Gönder</button>
  <button onclick="listMsgs()">Mesajları Listele</button>
  <button onclick="checkRLS()">RLS & Tablo Kontrol</button>
</div>

<div class="section">
  <h3>3. LOG</h3>
  <button onclick="clearLog()" class="red">Temizle</button>
  <div id="log">Loglar burada görünecek...\n</div>
</div>

<script>
const SURL='https://sbubvjeguxuqgiklrajk.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidWJ2amVndXh1cWdpa2xyYWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzOTQxNTIsImV4cCI6MjA4Nzk3MDE1Mn0.dVwPmfxu2B0o9M-lMr5_k_Qy3YPDfiuk-TX2emDk9SQ';
const sb=window.supabase.createClient(SURL,SKEY);
let user=null;

function log(msg,cls='inf'){
  const el=document.getElementById('log');
  const t=new Date().toLocaleTimeString('tr-TR');
  el.innerHTML+=`<span class="${cls}">[${t}] ${msg}</span>\n`;
  el.scrollTop=el.scrollHeight;
}
function clearLog(){document.getElementById('log').innerHTML='';}

async function doLogin(){
  const email=document.getElementById('email').value;
  const pass=document.getElementById('pass').value;
  if(!email||!pass){log('Email ve şifre gerekli','err');return;}
  log(`Giriş yapılıyor: ${email}...`);
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){log(`❌ Giriş hatası: ${error.message}`,'err');return;}
  user=data.user;
  document.getElementById('userInfo').textContent=`✅ Giriş yapıldı\nUser ID: ${user.id}\nEmail: ${user.email}`;
  log(`✅ Giriş başarılı — ID: ${user.id}`,'ok');
}

async function checkRLS(){
  if(!user){log('Önce giriş yapın','err');return;}
  log('--- RLS & Tablo Kontrolü ---');
  
  // 1. Basit select
  const s1=await sb.from('mesajlar').select('count',{count:'exact',head:true});
  log(s1.error ? `❌ SELECT hatası: ${s1.error.code} ${s1.error.message}` : `✅ SELECT çalışıyor. Toplam: ${s1.count}`
    , s1.error?'err':'ok');

  // 2. Kolonlar var mı?
  const s2=await sb.from('mesajlar').select('id,gonderen_id,alici_id,icerik,resim_url,okundu,created_at').limit(1);
  log(s2.error ? `❌ Kolon hatası: ${s2.error.message}` : `✅ Tüm kolonlar mevcut`
    , s2.error?'err':'ok');

  // 3. Insert yetkisi
  const testPayload={gonderen_id:user.id,alici_id:user.id,icerik:'__rls_test__',okundu:false};
  const s3=await sb.from('mesajlar').insert([testPayload]).select().single();
  if(s3.error){
    log(`❌ INSERT hatası: ${s3.error.code}\n   Mesaj: ${s3.error.message}\n   Detay: ${s3.error.details||'-'}\n   İpucu: ${s3.error.hint||'-'}`,'err');
  } else {
    log(`✅ INSERT çalışıyor. ID: ${s3.data.id}`,'ok');
    // Temizle
    await sb.from('mesajlar').delete().eq('id',s3.data.id);
    log(`🗑️ Test mesajı silindi`);
  }
}

async function sendTest(){
  if(!user){log('Önce giriş yapın','err');return;}
  const alici=document.getElementById('aliciId').value.trim();
  const text=document.getElementById('msgText').value.trim();
  if(!alici){log('Alıcı ID gerekli!','err');return;}
  if(alici===user.id){log('Kendinize değil, BAŞKA bir kullanıcının ID\'sini girin!','warn');return;}
  
  log(`📤 Gönderiliyor → alici: ${alici}`);
  const payload={gonderen_id:user.id,alici_id:alici,icerik:text||'test',okundu:false};
  const{data,error}=await sb.from('mesajlar').insert([payload]).select().single();
  
  if(error){
    log(`❌ HATA: ${error.code}\n   ${error.message}\n   Detay: ${error.details||'-'}\n   İpucu: ${error.hint||'-'}`,'err');
    log(`\n⚠️ Hata kodu açıklaması:
  42501 = RLS politikası engelledi (en yaygın sorun)
  23503 = Foreign key hatası (alici_id auth.users'da yok)
  23502 = NOT NULL ihlali
  PGRST301 = JWT/auth sorunu`,'warn');
  } else {
    log(`✅ Başarılı! Mesaj ID: ${data.id}`,'ok');
  }
}

async function listMsgs(){
  if(!user){log('Önce giriş yapın','err');return;}
  log('--- Son 10 Mesaj ---');
  const{data,error}=await sb.from('mesajlar')
    .select('*')
    .or(`gonderen_id.eq.${user.id},alici_id.eq.${user.id}`)
    .order('created_at',{ascending:false})
    .limit(10);
  if(error){log(`❌ ${error.code}: ${error.message}`,'err');return;}
  if(!data.length){log('Hiç mesaj yok','warn');return;}
  data.forEach((m,i)=>{
    const dir=m.gonderen_id===user.id?'→ GÖNDERİLEN':'← ALINAN';
    const kendi=m.alici_id===m.gonderen_id?' ⚠️(kendinize!)':'';
    log(`[${i+1}] ${dir}${kendi}\n    icerik: "${m.icerik||'(görsel)'}"\n    alici: ${m.alici_id}\n    zaman: ${new Date(m.created_at).toLocaleString('tr-TR')}`,'inf');
  });
}

// Sayfa açılınca mevcut session kontrol et
sb.auth.getSession().then(({data})=>{
  if(data.session){
    user=data.session.user;
    document.getElementById('userInfo').textContent=`✅ Oturum açık\nUser ID: ${user.id}\nEmail: ${user.email}`;
    log(`🔑 Mevcut oturum: ${user.email}`,'ok');
  }
});
</script>
</body>
</html>
