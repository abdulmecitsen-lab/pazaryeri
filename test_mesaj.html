<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesaj Test v3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:monospace;padding:20px;background:#0f0f0f;color:#eee;max-width:700px;margin:0 auto}
    h2{color:#fff;margin-bottom:16px}
    .box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:14px}
    .box h3{color:#ffaa00;font-size:13px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
    button{background:#222;color:#00cc00;border:1px solid #00cc00;padding:9px 14px;cursor:pointer;margin:3px;border-radius:5px;font-size:12px}
    button:hover{background:#003300}
    button.warn{color:#ffaa00;border-color:#ffaa00}
    input{background:#111;border:1px solid #444;color:white;padding:8px;border-radius:4px;width:100%;margin:3px 0;font-size:12px}
    label{color:#888;font-size:11px;display:block;margin-top:6px}
    #log{background:#111;border:1px solid #1a1a1a;padding:12px;border-radius:6px;white-space:pre-wrap;font-size:11px;line-height:1.7;min-height:120px;max-height:350px;overflow-y:auto;margin-top:8px}
    .ok{color:#00cc00}.err{color:#ff4444}.warn{color:#ffaa00}.inf{color:#6699ff}
    .status{padding:8px 10px;border-radius:5px;font-size:12px;margin-top:8px;background:#111;border:1px solid #333}
    .users{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
    .user-card{background:#111;border:1px solid #333;border-radius:6px;padding:10px;cursor:pointer;transition:.2s;font-size:11px}
    .user-card:hover{border-color:#ffaa00}
    .user-card.selected{border-color:#00cc00;background:#001a00}
    .user-card .name{font-weight:bold;color:#fff;margin-bottom:4px}
    .user-card .email{color:#888;word-break:break-all}
    .user-card .uid{color:#555;font-size:10px;margin-top:4px;word-break:break-all}
  </style>
</head>
<body>
<h2>🔧 Pazaryeri — Mesaj Test v3</h2>

<div class="box">
  <h3>1. Giriş Yap</h3>
  <label>E-posta</label><input id="email" type="email" placeholder="mail@ornek.com">
  <label>Şifre</label><input id="pass" type="password">
  <button onclick="doLogin()">Giriş Yap</button>
  <div class="status" id="loginStatus">Giriş yapılmadı</div>
</div>

<div class="box">
  <h3>2. Alıcı Seç (tıklayın)</h3>
  <div class="users">
    <div class="user-card" onclick="selectUser('dd930368-97f1-4558-8fe9-5c5737b4b7c4','mecit','abdulmecitsen@gmail.com',this)">
      <div class="name">mecit</div>
      <div class="email">abdulmecitsen@gmail.com</div>
      <div class="uid">dd930368...</div>
    </div>
    <div class="user-card" onclick="selectUser('827a0dfe-3b33-4844-9aa2-8f1206ab28af','Nesrine Şen','nesrinesen2012@gmail.com',this)">
      <div class="name">Nesrine Şen</div>
      <div class="email">nesrinesen2012@gmail.com</div>
      <div class="uid">827a0dfe...</div>
    </div>
    <div class="user-card" onclick="selectUser('55c9bdb1-e686-4d26-b122-7271b437afd7','Okan','senfield1625@hotmail.com',this)">
      <div class="name">Okan</div>
      <div class="email">senfield1625@hotmail.com</div>
      <div class="uid">55c9bdb1...</div>
    </div>
  </div>
  <div class="status" id="aliciStatus">Alıcı seçilmedi</div>
</div>

<div class="box">
  <h3>3. Test</h3>
  <label>Mesaj metni</label>
  <input id="msgText" value="Merhaba! Test mesajı.">
  <button onclick="sendTest()">📤 Mesaj Gönder</button>
  <button onclick="listMsgs()">📋 Mesajları Listele</button>
  <button onclick="checkInsert()">🔍 INSERT İzni Test Et</button>
  <button onclick="clearLog()" class="warn">Log Temizle</button>
  <div id="log">Loglar burada görünecek...\n</div>
</div>

<script>
const SURL='https://sbubvjeguxuqgiklrajk.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidWJ2amVndXh1cWdpa2xyYWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzOTQxNTIsImV4cCI6MjA4Nzk3MDE1Mn0.dVwPmfxu2B0o9M-lMr5_k_Qy3YPDfiuk-TX2emDk9SQ';
const sb=window.supabase.createClient(SURL,SKEY);
let user=null, aliciId=null, aliciName=null;

function log(msg,cls='inf'){
  const el=document.getElementById('log');
  const t=new Date().toLocaleTimeString('tr-TR');
  el.innerHTML+=`<span class="${cls}">[${t}] ${msg}</span>\n`;
  el.scrollTop=el.scrollHeight;
}
function clearLog(){document.getElementById('log').innerHTML='';}

function selectUser(id,name,email,el){
  document.querySelectorAll('.user-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  aliciId=id; aliciName=name;
  document.getElementById('aliciStatus').textContent=`✅ Seçilen alıcı: ${name} (${email})`;
  log(`👤 Alıcı seçildi: ${name} — ${id}`,'ok');
}

async function doLogin(){
  const email=document.getElementById('email').value;
  const pass=document.getElementById('pass').value;
  if(!email||!pass){log('Email ve şifre gerekli','err');return;}
  log(`🔐 Giriş: ${email}...`);
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){log(`❌ ${error.message}`,'err');document.getElementById('loginStatus').textContent='❌ Giriş başarısız: '+error.message;return;}
  user=data.user;
  document.getElementById('loginStatus').textContent=`✅ Giriş yapıldı: ${user.email} (${user.id})`;
  log(`✅ Giriş başarılı — ${user.email}`,'ok');
  log(`   User ID: ${user.id}`,'inf');
}

async function checkInsert(){
  if(!user){log('Önce giriş yapın','err');return;}
  log('--- INSERT İzni Kontrol ---');
  const payload={gonderen_id:user.id,alici_id:user.id,icerik:'__test__',okundu:false};
  const{data,error}=await sb.from('mesajlar').insert([payload]).select().single();
  if(error){
    log(`❌ INSERT HATASI:\n   Kod: ${error.code}\n   Mesaj: ${error.message}\n   Detay: ${error.details||'-'}\n   İpucu: ${error.hint||'-'}`,'err');
  } else {
    log(`✅ INSERT çalışıyor! ID: ${data.id}`,'ok');
    await sb.from('mesajlar').delete().eq('id',data.id);
    log(`🗑️ Test mesajı silindi`);
  }
}

async function sendTest(){
  if(!user){log('Önce giriş yapın','err');return;}
  if(!aliciId){log('Önce alıcı seçin (yukarıdaki kartlardan)','err');return;}
  if(aliciId===user.id){log('⚠️ Kendinize mesaj gönderiyorsunuz! Başka biriyle giriş yapın.','warn');return;}
  const text=document.getElementById('msgText').value.trim()||'test';
  const payload={gonderen_id:user.id,alici_id:aliciId,icerik:text,okundu:false};
  log(`📤 Gönderiliyor: "${text}"\n   Gönderen: ${user.email}\n   Alıcı: ${aliciName}`);
  const{data,error}=await sb.from('mesajlar').insert([payload]).select().single();
  if(error){
    log(`❌ HATA: ${error.code} — ${error.message}\n   ${error.hint||''}`,'err');
  } else {
    log(`✅ MESAJ GÖNDERİLDİ!\n   ID: ${data.id}\n   Zaman: ${new Date(data.created_at).toLocaleString('tr-TR')}`,'ok');
  }
}

async function listMsgs(){
  if(!user){log('Önce giriş yapın','err');return;}
  log('--- Mesajlar ---');
  const{data,error}=await sb.from('mesajlar')
    .select('*').or(`gonderen_id.eq.${user.id},alici_id.eq.${user.id}`)
    .order('created_at',{ascending:false}).limit(10);
  if(error){log(`❌ ${error.code}: ${error.message}`,'err');return;}
  if(!data.length){log('Hiç mesaj yok','warn');return;}
  data.forEach((m,i)=>{
    const dir=m.gonderen_id===user.id?'→ GÖNDERİLEN':'← ALINAN';
    const kendi=m.alici_id===m.gonderen_id?' ⚠️ (kendinize!)':'';
    log(`[${i+1}] ${dir}${kendi} | "${m.icerik||'📷'}" | ${new Date(m.created_at).toLocaleString('tr-TR')}`,'inf');
  });
}

sb.auth.getSession().then(({data})=>{
  if(data.session){
    user=data.session.user;
    document.getElementById('loginStatus').textContent=`✅ Oturum açık: ${user.email} (${user.id})`;
    log(`🔑 Mevcut oturum: ${user.email}`,'ok');
  }
});
</script>
</body>
</html>
