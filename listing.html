<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlan Detay — Pazaryeri</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
  <style>
    .det-wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
    .breadcrumb{font-size:13px;color:var(--text3);margin-bottom:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .breadcrumb a{color:var(--primary);text-decoration:none}
    .breadcrumb a:hover{text-decoration:underline}
    .breadcrumb-sep{color:var(--text3)}
    .det-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
    /* Gallery */
    .gallery-wrap{position:relative}
    .gallery-main{position:relative;border-radius:12px;overflow:hidden;background:#f3f4f6;aspect-ratio:4/3}
    .gallery-main img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
    .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.9);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;transition:background .15s;color:var(--text)}
    .gallery-nav:hover{background:white}
    .gallery-nav.prev{left:10px}.gallery-nav.next{right:10px}
    .gallery-nav:disabled{opacity:.3;cursor:default}
    .gallery-counter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:white;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
    .gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .gallery-thumb{width:72px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2.5px solid transparent;transition:border-color .15s,opacity .15s;opacity:.75}
    .gallery-thumb.active{border-color:var(--primary);opacity:1}
    .gallery-thumb:hover{opacity:1}
    /* Cards */
    .det-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px}
    .det-card-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:12px}
    .desc-text{font-size:14px;line-height:1.75;color:var(--text2);white-space:pre-wrap}
    .det-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .spec{background:var(--bg);border-radius:8px;padding:10px 13px}
    .spec-l{font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
    .spec-v{font-size:13px;font-weight:700;color:var(--text)}
    /* Sidebar */
    .det-sidebar{position:sticky;top:80px}
    .det-main-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
    .det-badge-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .det-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#e8f5e9;color:#2e7d32}
    .det-badge.used{background:#fff3e0;color:#e65100}
    .det-for-sale{font-size:13px;color:var(--text3)}
    .det-title{font-size:22px;font-weight:900;color:var(--text);line-height:1.25;margin-bottom:10px}
    .det-price{font-size:30px;font-weight:900;color:var(--primary);margin-bottom:10px}
    .det-location{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);margin-bottom:16px;flex-wrap:wrap}
    .btn-primary-full{width:100%;padding:13px;background:var(--primary);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:background .15s;text-decoration:none}
    .btn-primary-full:hover{background:#c0392b}
    .btn-outline-full{width:100%;padding:11px;background:none;color:var(--primary);border:1.5px solid var(--primary);border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:.15s;text-decoration:none}
    .btn-outline-full:hover{background:#fff3e0}
    .btn-save-share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .btn-ss{padding:9px;background:none;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text2);transition:.15s}
    .btn-ss:hover{border-color:var(--primary);color:var(--primary)}
    .seller-av{width:48px;height:48px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
    .seller-name{font-weight:800;font-size:15px;color:var(--text)}
    .seller-role{font-size:12px;color:var(--text3);margin-top:2px}
    .det-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .det-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#fff3e0;color:#e65100}
    .det-report{font-size:12px;color:var(--text3);text-align:center;margin-top:8px;cursor:pointer}
    .det-report:hover{color:var(--primary)}
    @media(max-width:860px){.det-grid{grid-template-columns:1fr}.det-sidebar{position:static}.gallery-thumb{width:56px;height:44px}}
  </style>
</head>

function toast(m,t='success'){const ic={success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};const el=document.createElement('div');el.className='toast'+(t!=='success'?' '+t:'');el.innerHTML='<span>'+ic[t]+'</span><span>'+m+'</span>';document.getElementById('toastContainer').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3500);}
const fmt=n=>(n&&n>0)?'₺'+Number(n).toLocaleString('tr-TR'):'Ücretsiz';

window.openModal=i=>{document.getElementById(i).classList.add('open');document.body.style.overflow='hidden';};
window.closeModal=i=>{document.getElementById(i).classList.remove('open');document.body.style.overflow='';};
window.switchModal=(a,b)=>{closeModal(a);openModal(b);};
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);}));
window.doLogin=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:document.getElementById('lEmail').value,password:document.getElementById('lPass').value});if(error){toast(error.message,'error');return;}toast('Hoş geldin!');closeModal('loginModal');};
window.doSignup=async e=>{e.preventDefault();const{error}=await sb.auth.signUp({email:document.getElementById('sEmail').value,password:document.getElementById('sPass').value,options:{data:{full_name:document.getElementById('sName').value}}});if(error){toast(error.message,'error');return;}toast('Kayıt başarılı!');closeModal('signupModal');};
sb.auth.onAuthStateChange((ev,ses)=>{user=ses?.user||null;renderAuth();});
function renderAuth(){const a=document.getElementById('authArea');if(!a)return;if(user){const nm=user.user_metadata?.full_name||user.email;a.innerHTML='<a href="profile.html"><div class="user-avatar" style="background:var(--primary)">'+ini(nm)+'</div></a>';}else a.innerHTML='<button class="btn-signin" onclick="openModal(\'loginModal\')">Giriş Yap</button>';}

window.galGo=dir=>{galIdx=Math.max(0,Math.min(galleryImgs.length-1,galIdx+dir));updateGallery();};
window.galSet=i=>{galIdx=i;updateGallery();};
function updateGallery(){
  const mi=document.getElementById('galMain'),counter=document.getElementById('galCounter');
  if(mi){mi.style.opacity='0';setTimeout(()=>{mi.src=galleryImgs[galIdx];mi.style.opacity='1';},150);}
  if(counter)counter.textContent=(galIdx+1)+' / '+galleryImgs.length;
  document.querySelectorAll('.gallery-thumb').forEach((t,i)=>t.classList.toggle('active',i===galIdx));
  const pBtn=document.querySelector('.gallery-nav.prev'),nBtn=document.querySelector('.gallery-nav.next');
  if(pBtn)pBtn.disabled=galIdx===0;
  if(nBtn)nBtn.disabled=galIdx===galleryImgs.length-1;
}

async function load(){
  if(!id){show404();return;}
  if(DEMO[id]){render(DEMO[id]);return;}
  const{data,error}=await sb.from('urunler').select('*').eq('id',id).single();
  if(error||!data){show404();return;}
  render(data);
}

function show404(){document.getElementById('pageWrap').innerHTML='<div style="text-align:center;padding:80px 20px"><div style="font-size:3rem;margin-bottom:12px">📭</div><h3 style="font-size:20px;font-weight:900;color:var(--text);margin-bottom:8px">İlan Bulunamadı</h3><p style="color:var(--text3);margin-bottom:20px">Bu ilan silinmiş veya mevcut değil.</p><a href="index.html" style="padding:10px 24px;background:var(--primary);color:white;border-radius:var(--radius);font-weight:700;text-decoration:none">← İlanlara Dön</a></div>';}

function render(it){
  document.title=(it.isim||'İlan')+' — Pazaryeri';
  const condMap={'ikinci-el':['used','İkinci El'],'sifir':['','Sıfır'],'yeniye-yakin':['used','Yeniye Yakın'],'satilik':['','Satılık'],'kiralik':['used','Kiralık'],'hasarli':['used','Hasarlı'],'yenilenmiş':['','Yenilenmiş']};
  const[badgeCls,badgeLbl]=condMap[it.durum]||['used','İkinci El'];
  const sellerName=it.seller_name||'Satıcı';
  const favs=JSON.parse(localStorage.getItem('pm_favs')||'[]');
  const isFav=favs.includes(String(it.id));
  // Build images
  let images=[];
  if(it.resim_urls&&Array.isArray(it.resim_urls))images=it.resim_urls;
  else if(it.resim_url)images=[it.resim_url];
  if(it.id&&String(it.id).startsWith('d')&&images.length===1){const s=it.id;images=[images[0],'https://picsum.photos/seed/'+s+'2/600/400','https://picsum.photos/seed/'+s+'3/600/400','https://picsum.photos/seed/'+s+'4/600/400'];}
  if(!images.length)images=['https://picsum.photos/seed/default/600/400'];
  galleryImgs=images;galIdx=0;
  const catLink=it.kategori?'category.html?cat='+it.kategori:'index.html';
  const subLink=it.alt_kategori?'category.html?cat='+it.kategori+'&sub='+it.alt_kategori:catLink;
  const ago_str=ago(it.created_at);
  const desc=(it.aciklama||'Açıklama girilmemiş.').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const thumbsHtml=images.map((src,i)=>'<img class="gallery-thumb'+(i===0?' active':'')+'" src="'+src+'" onclick="galSet('+i+')" alt="Fotoğraf '+(i+1)+'" loading="lazy">').join('');
  const navSvgPrev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>';
  const navSvgNext='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>';

  document.getElementById('pageWrap').innerHTML=`
  <div class="breadcrumb">
    <a href="index.html">Ana Sayfa</a><span class="breadcrumb-sep">›</span>
    <a href="${catLink}">${it.kategori||'İlan'}</a>
    ${it.alt_kategori?'<span class="breadcrumb-sep">›</span><a href="'+subLink+'">'+it.alt_kategori+'</a>':''}
    <span class="breadcrumb-sep">›</span><span>${it.isim||'İlan'}</span>
  </div>
  <div class="det-grid">
    <div>
      <div class="gallery-wrap">
        <div class="gallery-main">
          <img id="galMain" src="${images[0]}" alt="${it.isim||''}" onerror="this.src='https://picsum.photos/seed/default/600/400'">
          <button class="gallery-nav prev" onclick="galGo(-1)" ${images.length<=1?'disabled':''}>${navSvgPrev}</button>
          <button class="gallery-nav next" onclick="galGo(1)" ${images.length<=1?'disabled':''}>${navSvgNext}</button>
          ${images.length>1?'<div class="gallery-counter" id="galCounter">1 / '+images.length+'</div>':''}
        </div>
        ${images.length>1?'<div class="gallery-thumbs">'+thumbsHtml+'</div>':''}
      </div>
      <div class="det-card">
        <div class="det-card-title">Açıklama</div>
        <div class="desc-text">${desc}</div>
      </div>
      <div class="det-card">
        <div class="det-card-title">İlan Detayları</div>
        <div class="det-specs">
          <div class="spec"><div class="spec-l">Durum</div><div class="spec-v">${badgeLbl}</div></div>
          <div class="spec"><div class="spec-l">Konum</div><div class="spec-v">${it.konum||'—'}</div></div>
          <div class="spec"><div class="spec-l">Kategori</div><div class="spec-v">${it.kategori||'—'}</div></div>
          ${it.alt_kategori?'<div class="spec"><div class="spec-l">Alt Kategori</div><div class="spec-v">'+it.alt_kategori+'</div></div>':''}
          <div class="spec"><div class="spec-l">İlan Tarihi</div><div class="spec-v">${new Date(it.created_at).toLocaleDateString('tr-TR')}</div></div>
          <div class="spec"><div class="spec-l">İlan No</div><div class="spec-v">#${String(it.id).slice(-6)}</div></div>
        </div>
        ${(it.acil||it.pazarlik||it.takas)?'<div class="det-tags">'+(it.acil?'<span class="det-tag">🔥 Acil Satılık</span>':'')+(it.pazarlik?'<span class="det-tag">🤝 Pazarlık Yapılır</span>':'')+(it.takas?'<span class="det-tag">🔄 Takasla Olur</span>':'')+'</div>':''}
      </div>
    </div>
    <div class="det-sidebar">
      <div class="det-main-card">
        <div class="det-badge-row">
          <span class="det-badge ${badgeCls}">${badgeLbl}</span>
          <span class="det-for-sale">Satışta</span>
        </div>
        <div class="det-title">${it.isim||'İlan'}</div>
        <div class="det-price">${fmt(it.fiyat)}</div>
        <div class="det-location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${it.konum||'Konum belirtilmemiş'}
          ${ago_str?'<span style="color:var(--text3)">·</span><span>'+ago_str+'</span>':''}
        </div>
        <button class="btn-primary-full" onclick="goMsg('${it.id}','${it.user_id||''}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Mesaj Gönder
        </button>
        ${it.telefon?'<button class="btn-outline-full" id="phoneBtn" onclick="showPhone(\''+it.telefon+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.07 6.07l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Telefonu Göster</button>':''}
        <div class="btn-save-share">
          <button class="btn-ss" id="favBtn" onclick="toggleFav('${it.id}',this)">
            <svg viewBox="0 0 24 24" fill="${isFav?'var(--primary)':'none'}" stroke="${isFav?'var(--primary)':'currentColor'}" stroke-width="2" width="14" height="14"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${isFav?'Favoride':'Kaydet'}
          </button>
          <button class="btn-ss" onclick="shareItem()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Paylaş
          </button>
        </div>
        <div class="det-report" onclick="toast('Şikayet alındı.','info')">🚩 İlanı Şikayet Et</div>
      </div>
      <div class="det-main-card">
        <div class="det-card-title">Satıcı</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div class="seller-av">${ini(sellerName)}</div>
          <div><div class="seller-name">${sellerName}</div><div class="seller-role">Üye Satıcı</div></div>
        </div>
        <button class="btn-outline-full" onclick="goMsg('${it.id}','${it.user_id||''}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Mesaj Gönder
        </button>
      </div>
    </div>
  </div>`;
}

window.toggleFav=(id,btn)=>{let favs=JSON.parse(localStorage.getItem('pm_favs')||'[]');const sid=String(id);const svg=btn.querySelector('svg');if(favs.includes(sid)){favs=favs.filter(f=>f!==sid);if(svg){svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');}btn.innerHTML=btn.innerHTML.replace('Favoride','Kaydet');toast('Favorilerden çıkarıldı','info');}else{favs.push(sid);if(svg){svg.setAttribute('fill','var(--primary)');svg.setAttribute('stroke','var(--primary)');}btn.innerHTML=btn.innerHTML.replace('Kaydet','Favoride');toast('Favorilere eklendi ❤️');}localStorage.setItem('pm_favs',JSON.stringify(favs));};
window.showPhone=tel=>{const btn=document.getElementById('phoneBtn');if(btn){btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.07 6.07l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> '+tel;btn.onclick=()=>window.open('tel:'+tel);}};
window.shareItem=()=>{if(navigator.share){navigator.share({title:document.title,url:window.location.href});}else{navigator.clipboard.writeText(window.location.href);toast('Link kopyalandı','info');}};
window.goMsg=async(listingId,sellerId)=>{if(!user){toast('Mesaj için giriş yapın','warning');openModal('loginModal');return;}if(!sellerId||sellerId===''||sellerId==='undefined'||sellerId.startsWith('u')){toast('Satıcı bilgisi alınıyor...','info');try{const{data}=await sb.from('urunler').select('user_id').eq('id',listingId).single();if(data?.user_id)sellerId=data.user_id;else{toast('Bu ilan demo içeriği.','warning');return;}}catch(e){toast('Satıcı bilgisi alınamadı.','error');return;}}if(user.id===sellerId){toast('Kendi ilanınıza mesaj gönderemezsiniz','warning');return;}window.location.href='messages.html?listing='+listingId+'&seller='+sellerId;};

load();
})();
</script>
</body>
</html>
