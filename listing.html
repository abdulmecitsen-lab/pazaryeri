<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlan Detay — Pazaryeri</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
  <style>
    .det-page{max-width:1080px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
    .det-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
    .det-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
    .det-title{font-size:22px;font-weight:900;color:var(--text);margin-bottom:6px;line-height:1.25}
    .det-price{font-size:28px;font-weight:900;color:var(--primary);margin-bottom:14px}
    .det-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .spec{background:var(--bg);border-radius:8px;padding:10px 13px}
    .spec-l{font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
    .spec-v{font-size:13px;font-weight:700;color:var(--text)}
    .seller-av{width:50px;height:50px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
    .btn-msg{width:100%;padding:12px;background:var(--primary);color:white;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px;transition:.15s}
    .btn-msg:hover{background:var(--primary-dark)}
    .btn-phone{width:100%;padding:10px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
    .btn-phone:hover{border-color:var(--primary);color:var(--primary)}
    .desc-text{font-size:14px;line-height:1.75;color:var(--text2);white-space:pre-wrap;margin-top:10px}
    .sec-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:10px}
    .breadcrumb{font-size:13px;color:var(--text3);margin-bottom:16px}
    .breadcrumb a{color:var(--primary);text-decoration:none}
    @media(max-width:740px){.det-page{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo-wrap">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div><div class="logo-text">Pazar<span>yeri</span></div><div class="logo-tagline">İlan & Alım Satım</div></div>
    </a>
    <div style="flex:1"></div>
    <div class="header-right">
      <a href="index.html" class="btn-signin" style="text-decoration:none">← İlanlara Dön</a>
      <div id="authArea"></div>
    </div>
  </div>
</header>

<div id="pageWrap" style="min-height:60vh;display:flex;align-items:center;justify-content:center">
  <div style="text-align:center;color:var(--text3)">
    <div style="font-size:2rem;margin-bottom:8px">⏳</div>Yükleniyor...
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <h2>Giriş Yap 👋</h2>
    <form onsubmit="doLogin(event)">
      <div class="form-group"><label class="form-label">E-posta</label><input type="email" id="lEmail" class="form-input" required></div>
      <div class="form-group"><label class="form-label">Şifre</label><input type="password" id="lPass" class="form-input" required></div>
      <button type="submit" class="btn-submit">Giriş Yap</button>
    </form>
    <div class="form-footer">Hesabınız yok mu? <a onclick="switchModal('loginModal','signupModal')">Kayıt Ol</a></div>
  </div>
</div>
<div class="modal-overlay" id="signupModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('signupModal')">✕</button>
    <h2>Hesap Oluştur 🎉</h2>
    <form onsubmit="doSignup(event)">
      <div class="form-group"><label class="form-label">Ad Soyad</label><input type="text" id="sName" class="form-input" required></div>
      <div class="form-group"><label class="form-label">E-posta</label><input type="email" id="sEmail" class="form-input" required></div>
      <div class="form-group"><label class="form-label">Şifre</label><input type="password" id="sPass" class="form-input" minlength="8" required></div>
      <button type="submit" class="btn-submit">Kayıt Ol</button>
    </form>
  </div>
</div>

<script>
(function(){
'use strict';
const SURL='https://sbubvjeguxuqgiklrajk.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidWJ2amVndXh1cWdpa2xyYWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzOTQxNTIsImV4cCI6MjA4Nzk3MDE1Mn0.dVwPmfxu2B0o9M-lMr5_k_Qy3YPDfiuk-TX2emDk9SQ';
const sb=window.supabase.createClient(SURL,SKEY);
let user=null;
const id=new URLSearchParams(window.location.search).get('id');

function toast(m,t='success'){const ic={success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};const el=document.createElement('div');el.className='toast'+(t!=='success'?' '+t:'');el.innerHTML=`<span>${ic[t]}</span><span>${m}</span>`;document.getElementById('toastContainer').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3500);}
const fmt=n=>(n&&n>0)?'₺'+Number(n).toLocaleString('tr-TR'):'Ücretsiz';
const ini=n=>(n||'?').split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();

window.openModal=id=>{document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';};
window.closeModal=id=>{document.getElementById(id).classList.remove('open');document.body.style.overflow='';};
window.switchModal=(a,b)=>{closeModal(a);openModal(b);};
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);}));

window.doLogin=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:document.getElementById('lEmail').value,password:document.getElementById('lPass').value});if(error){toast(error.message,'error');return;}toast('Hoş geldin!');closeModal('loginModal');};
window.doSignup=async e=>{e.preventDefault();const{error}=await sb.auth.signUp({email:document.getElementById('sEmail').value,password:document.getElementById('sPass').value,options:{data:{full_name:document.getElementById('sName').value}}});if(error){toast(error.message,'error');return;}toast('Kayıt başarılı! 📧');closeModal('signupModal');};

sb.auth.onAuthStateChange((ev,ses)=>{user=ses?.user||null;renderAuth();});

function renderAuth(){
  const a=document.getElementById('authArea');if(!a)return;
  if(user){const nm=user.user_metadata?.full_name||user.email;a.innerHTML=`<a href="profile.html"><div class="user-avatar" style="background:var(--primary)">${ini(nm)}</div></a>`;}
  else a.innerHTML=`<button class="btn-signin" onclick="openModal('loginModal')">Giriş Yap</button>`;
}

const DEMO={
  d1:{id:'d1',isim:'2019 BMW 3 Serisi 320i M Sport',kategori:'vasita',fiyat:850000,resim_url:'https://picsum.photos/seed/bmw320i/600/400',durum:'ikinci-el',konum:'İstanbul',aciklama:'Araç son derece bakımlı. Servis geçmişi mevcut. Hasar kaydı yok. Orijinal boyalı. İlk sahibinden.',telefon:'05321234567',user_id:'u1',seller_name:'Ahmet K.',created_at:new Date().toISOString()},
  d2:{id:'d2',isim:'3+1 Satılık Daire Kadıköy',kategori:'emlak',fiyat:4200000,resim_url:'https://picsum.photos/seed/kadikoy/600/400',durum:'satilik',konum:'İstanbul / Kadıköy',aciklama:'Deniz manzaralı, güney cepheli 3+1 satılık daire. 120m2. Metrobüs yakını. Tapu hazır.',telefon:'05329876543',user_id:'u2',seller_name:'Fatma S.',created_at:new Date().toISOString()},
  d3:{id:'d3',isim:'iPhone 15 Pro Max 256GB Titanium',kategori:'elektronik',fiyat:52000,resim_url:'https://picsum.photos/seed/iph15pro/600/400',durum:'sifir',konum:'Ankara',aciklama:'Sıfır, hiç açılmamış kutu. Faturalı. Garantili.',telefon:'05335556677',user_id:'u3',seller_name:'Mehmet T.',created_at:new Date().toISOString()},
};

async function load(){
  if(!id){show404();return;}
  if(DEMO[id]){render(DEMO[id]);return;}
  const{data,error}=await sb.from('urunler').select('*').eq('id',id).single();
  if(error||!data){show404();return;}
  render(data);
}

function show404(){
  document.getElementById('pageWrap').innerHTML=`<div style="text-align:center;padding:80px 20px">
    <div style="font-size:3rem;margin-bottom:12px">📭</div>
    <h3 style="font-size:20px;font-weight:900;color:var(--text);margin-bottom:8px">İlan Bulunamadı</h3>
    <p style="color:var(--text3);margin-bottom:20px">Bu ilan silinmiş veya mevcut değil.</p>
    <a href="index.html" style="padding:10px 24px;background:var(--primary);color:white;border-radius:var(--radius);font-weight:700;text-decoration:none">← İlanlara Dön</a>
  </div>`;
}

function render(it){
  document.title=`${it.isim||'İlan'} — Pazaryeri`;
  const conds={'ikinci-el':'İkinci El','sifir':'Sıfır','yeniye-yakin':'Yeniye Yakın','satilik':'Satılık','kiralik':'Kiralık'};
  const favs=JSON.parse(localStorage.getItem('pm_favs')||'[]');
  const isFav=favs.includes(String(it.id));
  const sellerName=it.seller_name||'Satıcı';
  const imgSrc=it.resim_url||`https://picsum.photos/seed/${it.id}/600/400`;

  document.getElementById('pageWrap').innerHTML=`
  <div class="det-page">
    <div>
      <div class="breadcrumb"><a href="index.html">Ana Sayfa</a> › <a href="index.html" onclick="return true">${it.kategori||'İlan'}</a> › ${it.isim||'İlan'}</div>
      <img class="det-img" id="mainImg" src="${imgSrc}" alt="${it.isim||''}" onerror="this.src='https://picsum.photos/seed/x/600/400'">
      <div class="det-card" style="margin-top:16px">
        <div class="sec-lbl">Açıklama</div>
        <div class="desc-text">${(it.aciklama||'Açıklama girilmemiş.').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      </div>
    </div>
    <div>
      <div class="det-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="lc-cat" style="margin-bottom:6px">${it.kategori||''}</div>
          <button onclick="toggleFav('${it.id}',this)" style="background:none;border:none;cursor:pointer;font-size:22px;line-height:1">${isFav?'❤️':'🤍'}</button>
        </div>
        <div class="det-title">${it.isim||'İlan'}</div>
        <div class="det-price">${fmt(it.fiyat)}</div>
        <div class="det-specs">
          <div class="spec"><div class="spec-l">Durum</div><div class="spec-v">${conds[it.durum]||it.durum||'—'}</div></div>
          <div class="spec"><div class="spec-l">Konum</div><div class="spec-v">${it.konum||'—'}</div></div>
          <div class="spec"><div class="spec-l">Kategori</div><div class="spec-v">${it.kategori||'—'}</div></div>
          <div class="spec"><div class="spec-l">İlan Tarihi</div><div class="spec-v">${new Date(it.created_at).toLocaleDateString('tr-TR')}</div></div>
        </div>
      </div>
      <div class="det-card">
        <div class="sec-lbl">Satıcı</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div class="seller-av">${ini(sellerName)}</div>
          <div>
            <div style="font-weight:800;font-size:15px;color:var(--text)">${sellerName}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">Üye Satıcı</div>
          </div>
        </div>
        <button class="btn-msg" onclick="goMsg('${it.id}','${it.user_id||''}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Mesaj Gönder
        </button>
        ${it.telefon?`<button class="btn-phone" id="phoneBtn" onclick="showPhone('${it.telefon}')">📞 Telefonu Göster</button>`:''}
      </div>
    </div>
  </div>`;
}

window.toggleFav=(id,btn)=>{
  let favs=JSON.parse(localStorage.getItem('pm_favs')||'[]');const sid=String(id);
  if(favs.includes(sid)){favs=favs.filter(f=>f!==sid);btn.textContent='🤍';toast('Favorilerden çıkarıldı','info');}
  else{favs.push(sid);btn.textContent='❤️';toast('Favorilere eklendi ❤️');}
  localStorage.setItem('pm_favs',JSON.stringify(favs));
};
window.showPhone=tel=>{const btn=document.getElementById('phoneBtn');if(btn){btn.textContent='📞 '+tel;btn.style.color='var(--primary)';btn.onclick=null;}};
window.goMsg=async(listingId,sellerId)=>{
  if(!user){toast('Mesaj için giriş yapın','warning');openModal('loginModal');return;}
  // sellerId boşsa veya demo ise — ilanı Supabase'den çek
  if(!sellerId || sellerId==='' || sellerId==='undefined' || sellerId.startsWith('u')){
    toast('Satıcı bilgisi alınıyor...','info');
    try{
      const{data}=await sb.from('urunler').select('user_id').eq('id',listingId).single();
      if(data?.user_id) sellerId=data.user_id;
      else { toast('Bu ilan demo içeriği, gerçek bir satıcısı yok.','warning'); return; }
    }catch(e){ toast('Satıcı bilgisi alınamadı.','error'); return; }
  }
  if(user.id===sellerId){toast('Kendi ilanınıza mesaj gönderemezsiniz','warning');return;}
  window.location.href=`messages.html?listing=${listingId}&seller=${sellerId}`;
};

load();
})();
</script>
</body>
</html>
